name: Bug report
description: Report a reproducible problem without including credentials or private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, login tokens, Cookies, QR codes, SMS codes,
        browser profiles, signed media URLs, private content, or archived data.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Xiaohongshu
        - Douyin
        - Weibo
        - Bilibili
        - Web UI or general
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted values only.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, browser, and commit hash.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, Cookies, verification codes, private data, and archived content.
          required: true
