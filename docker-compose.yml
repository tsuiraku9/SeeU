services:
  archive:
    build: .
    container_name: public-content-archive
    restart: unless-stopped
    env_file:
      - path: ${SEEU_ENV_FILE:-.env}
        required: false
    environment:
      WEBUI_LOGIN_TOKEN: ${WEBUI_LOGIN_TOKEN:-}
      WEBUI_PORT: ${WEBUI_PORT:-${APP_PORT:-8080}}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      DATABASE_PATH: /app/data/state/app.db
      ARCHIVE_ROOT: /app/data/archive
      PROVIDER_STAGING_ROOT: /app/data/provider-staging
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-}
      PROVIDER_API_TOKEN: ${PROVIDER_API_TOKEN:-}
      PROVIDER_REQUEST_TIMEOUT_SECONDS: ${PROVIDER_REQUEST_TIMEOUT_SECONDS:-900}
      PROVIDER_DISCOVERY_LIMIT: ${PROVIDER_DISCOVERY_LIMIT:-500}
      PROVIDER_POLL_CONCURRENCY: ${PROVIDER_POLL_CONCURRENCY:-1}
      ALLOW_FAKE_IP_DNS: ${ALLOW_FAKE_IP_DNS:-false}
      TZ: ${TZ:-Asia/Hong_Kong}
      HOME: /tmp/archive-home
      TMPDIR: /app/data/provider-staging/.runtime-tmp
    command:
      - uvicorn
      - app.main:app
      - --app-dir
      - backend
      - --host
      - 0.0.0.0
      - --port
      - ${WEBUI_PORT:-${APP_PORT:-8080}}
      - --proxy-headers
      - --forwarded-allow-ips
      - 127.0.0.1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.environ.get('WEBUI_PORT', '8080');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    ports:
      - target: ${WEBUI_PORT:-${APP_PORT:-8080}}
        published: "${WEBUI_PORT:-${APP_PORT:-8080}}"
        host_ip: "${APP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - ./data/archive:/app/data/archive
      - ./data/state:/app/data/state
      - ./data/provider-staging:/app/data/provider-staging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    init: true
    pids_limit: 512
    mem_limit: ${ARCHIVE_MEMORY_LIMIT:-2g}
    shm_size: "1gb"
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
